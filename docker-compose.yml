services:

  backend:
    build:
      context: ./backend

    container_name: sticker2whatsapp-backend

    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:5500
      UPLOAD_FOLDER: /app/temp

    ports:
      - "5100:5000"

    restart: unless-stopped


  frontend:
    image: nginx:alpine

    container_name: sticker2whatsapp-frontend

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    ports:
      - "5500:80"

    depends_on:
      - backend

    restart: unless-stopped
